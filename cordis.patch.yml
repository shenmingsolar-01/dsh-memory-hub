# dsh-memory-hub bundle patch.
# The Loader inserts this plugin row; override the config with a same-id row
# in your profile's cordis.patch.yml.
- insert:
    - id: memory-hub
      name: dsh-memory-hub
      config:
        enabled: true
        # No telemetry and no outbound collection. Explicit opt-in only.
        consent: false
        host: 127.0.0.1
        # 0 = auto-pick a free local port; the chosen port is written to memory-hub.port
        port: 0
        snapshotLimit: 100
        # 0 = unlimited. The number of characters/sources/clients is not capped.
        historyLimit: 1000
        inboxLimit: 200
        # file: ""   # default: ~/.dsh/memory-hub.json
        # Empty by default: no channel URLs, accounts or personal data ship in this package.
        # Example (fill in your own local endpoint):
        # channels:
        #   qq:
        #     url: https://channel.example.invalid/hook
        #     body:
        #       who: your-character
        #       action: message
        #       text: '{{text}}'
        channels: {}
        # Optional: merge an offline source back at startup.
        # flush:
        #   - character: your-character
        #     from: offline
        #     to: default
        flush: []
        # Optional payment config. Disabled by default; fill your own checkout URL.
        payment:
          enabled: false
          provider: alipay
          checkoutUrl: ''
          currency: CNY
          presets: [10, 20, 50, 100, 300, 500]
        # Tools let the installer's own model write/read its own local memory.
        tools: true
        defaultCharacter: default
        defaultSource: model
        # OpenAI-compatible / Ollama endpoints. Empty means auto-detect only.
        models: []
        discoverPorts: [11434, 1234, 8000, 8080, 5000]
        # Public catalog; refreshed at most once per day. Set "" to disable.
        catalogUrl: https://fastly.jsdelivr.net/gh/shenmingsolar-01/dsh-memory-hub@main/providers-catalog.json
        catalogTtlMs: 86400000
